name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Lint backend
        run: python -m ruff check .

      - name: Test backend
        run: python -m pytest

      - name: Check generated OpenAPI contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from app.main import app

          target = Path("../openapi/open-playlist-engine.json")
          target.write_text(
              json.dumps(app.openapi(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git diff --exit-code -- ../openapi/open-playlist-engine.json

  database-migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPE_DATABASE_URL: postgresql+psycopg://ope:ope@localhost:5432/ope_ci
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ope
          POSTGRES_PASSWORD: ope
          POSTGRES_DB: ope_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ope -d ope_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install production backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Enforce a single Alembic head
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          print(f"Alembic heads: {', '.join(heads) if heads else '<none>'}")
          if len(heads) != 1:
              raise SystemExit(f"expected exactly one Alembic head, found {len(heads)}")
          PY

      - name: Upgrade a clean Postgres database
        run: python -m alembic upgrade head

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Check generated TypeScript API schema
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Compose environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build images without cache
        run: docker compose build --no-cache

      - name: Smoke-test the application stack
        run: |
          docker compose up --detach --no-build postgres valkey backend
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            --retry-max-time 90 \
            --connect-timeout 2 \
            http://127.0.0.1:8000/health
          echo

          docker compose up --detach --no-build worker frontend
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            --retry-max-time 90 \
            --connect-timeout 2 \
            http://127.0.0.1:8080/health
          echo

          sleep 5
          for service in postgres valkey backend worker frontend; do
            container_id="$(docker compose ps --all --quiet "$service")"
            if [ -z "$container_id" ]; then
              echo "::error::$service did not create a container" >&2
              exit 1
            fi

            state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
            restarts="$(docker inspect --format '{{.RestartCount}}' "$container_id")"
            if [ "$state" != "running" ] || [ "$restarts" -ne 0 ]; then
              echo "::error::$service is $state with $restarts restart(s)" >&2
              exit 1
            fi
          done

      - name: Show container diagnostics
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color --tail=200 || true

      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans
