site_name: Open Playlist Engine
site_description: Self-hosted playlist migration, generation, backup, and export
site_url: https://mbianchidev.github.io/open-playlist-engine/
repo_name: GitHub
repo_url: https://github.com/mbianchidev/open-playlist-engine
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  README.md

theme:
  name: mkdocs
  locale: en
  logo: assets/mark.svg
  favicon: assets/mark.svg
  color_mode: auto
  user_color_mode_toggle: true
  nav_style: dark
  navigation_depth: 3
  highlightjs: true
  hljs_languages:
    - bash
    - json
    - python
    - typescript
    - yaml

nav:
  - Home: index.md
  - Get started:
      - How it works: HOW_IT_WORKS.md
      - Configuration: CONFIGURATION.md
      - Connect providers: CONNECTING_PROVIDERS.md
  - Import & export:
      - Local playlist files: LOCAL_FILE_IMPORTS.md
      - Public URLs and pasted text: IMPORT_SOURCES.md
      - Portable exports: EXPORTING_PLAYLISTS.md
  - Workflows:
      - Playlist generator: PLAYLIST_GENERATOR.md
      - Library snapshots: SNAPSHOTS.md
      - Scheduled synchronization: SYNCHRONIZATION.md
      - Playlist Organizer: PLAYLIST_ORGANIZER.md
      - Migration history: MIGRATION_HISTORY.md
      - Playlist sharing: PLAYLIST_SHARING.md
  - Reference:
      - Design reference: DESIGN.md
      - Architecture decisions:
          - Initial architecture: adr/0001-architecture-decisions.md
          - Adapter fixture testing: adr/0002-adapter-fixture-testing.md
      - Continuous integration: CI.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/copy-code.js

copyright: Open Playlist Engine is available under the MIT License.
